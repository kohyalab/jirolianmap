name: 🧪 Test SNS Fetch (Dry Run / No Commit)

on:
  workflow_dispatch:
    inputs:
      target_shop:
        description: 'テスト対象の店舗ID または Xアカウント名 (例: jiro_kame, sendai2, matsudojiro3)'
        required: true
        default: 'jiro_kame'
        type: string

jobs:
  test_crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Safe SNS Fetch Test
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/test_fetch.js "${{ inputs.target_shop }}"

