name: Daily Jiro Tweet

on:
#  schedule:
    # JST 07:17 (UTC 22:17)
#    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Execution Environment (prod, dev, or preview)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - dev
          - prod
  repository_dispatch:
    types: [trigger-daily-post, daily-post]

jobs:
  tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright twitter-api-v2
          npx playwright install --with-deps chromium

      - name: Run script
        env:
          TZ: 'Asia/Tokyo'
          # workflow_dispatchまたはrepository_dispatchでdev/previewが選ばれたか判定
          EXEC_ENV: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'prod' }}
          PREVIEW_ONLY: ${{ ((github.event.inputs.environment || github.event.client_payload.environment) == 'preview') && 'true' || 'false' }}
          # devの時はDEV用Secretsを使用し、それ以外は本番用Secretsを使用
          TWITTER_API_KEY: ${{ (github.event.inputs.environment || github.event.client_payload.environment) == 'dev' && secrets.TWITTER_API_KEY_DEV || secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ (github.event.inputs.environment || github.event.client_payload.environment) == 'dev' && secrets.TWITTER_API_SECRET_DEV || secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ (github.event.inputs.environment || github.event.client_payload.environment) == 'dev' && secrets.TWITTER_ACCESS_TOKEN_DEV || secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ (github.event.inputs.environment || github.event.client_payload.environment) == 'dev' && secrets.TWITTER_ACCESS_SECRET_DEV || secrets.TWITTER_ACCESS_SECRET }}
        run: node bot.js


      - name: Commit preview image
        if: (github.event.inputs.environment || github.event.client_payload.environment) == 'preview'
        run: |
          git config "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p assets
          cp sheet.png assets/preview.png
          git add assets/preview.png
          git commit -m "Update preview image [skip ci]" || exit 0
          git push
