name: Daily Jiro Tweet

on:
  schedule:
    # JST 07:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Execution Environment (prod or dev)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright twitter-api-v2
          npx playwright install --with-deps chromium

      - name: Run script
        env:
          TZ: 'Asia/Tokyo'
          TWITTER_API_KEY: ${{ github.event.inputs.environment == 'prod' && secrets.TWITTER_API_KEY || secrets.TWITTER_API_KEY_DEV }}
          TWITTER_API_SECRET: ${{ github.event.inputs.environment == 'prod' && secrets.TWITTER_API_SECRET || secrets.TWITTER_API_SECRET_DEV }}
          TWITTER_ACCESS_TOKEN: ${{ github.event.inputs.environment == 'prod' && secrets.TWITTER_ACCESS_TOKEN || secrets.TWITTER_ACCESS_TOKEN_DEV }}
          TWITTER_ACCESS_SECRET: ${{ github.event.inputs.environment == 'prod' && secrets.TWITTER_ACCESS_SECRET || secrets.TWITTER_ACCESS_SECRET_DEV }}
        run: node bot.js