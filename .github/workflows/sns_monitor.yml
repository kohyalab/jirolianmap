name: SNS Schedule Monitor (X & Instagram)

on:
#  schedule:
#    # Cloudflare Workersから指示（repository_dispatch）をもとに実行するため、GitHub cronは停止
#    # JST 06:00 (UTC 21:00前日)
#    - cron: '0 21 * * *'
#    # JST 14:00 (UTC 05:00)
#    - cron: '0 5 * * *'
#    # JST 22:00 (UTC 13:00)
#    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Force re-scan recent posts without cache'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-sns-monitor, sns-monitor]

jobs:
  crawl_and_analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SNS Crawler & Gemini AI Analysis
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/sns_crawler.js

      - name: Commit & Push updated pending updates
        run: |
          git config --local user.email "action@github.com"
          git add data/sns_posts.json data/crawled_cache.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-detect SNS schedule changes [skip ci]" && git push origin HEAD:${{ github.event.client_payload.ref || 'main' }})


