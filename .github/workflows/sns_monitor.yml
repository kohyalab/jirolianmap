name: SNS Schedule Monitor (X & Instagram)

on:
  repository_dispatch:
    types: [trigger-sns-monitor, sns-monitor]
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Force re-scan recent posts without cache'
        required: false
        default: false
        type: boolean

jobs:
  crawl_and_analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SNS Crawler & Gemini AI Analysis
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/sns_crawler.js

      - name: Commit & Push updated pending updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/sns_posts.json data/crawled_cache.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-detect SNS schedule changes [skip ci]" && git pull --rebase origin ${{ github.event.client_payload.ref || 'main' }} && git push origin HEAD:${{ github.event.client_payload.ref || 'main' }})


