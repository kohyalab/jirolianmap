<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jirolian Map - Comprehensive Test Suite</title>
    <!-- Leaflet & html2canvas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error('GLOBAL ERROR:', msg, url, line, col, error);
            var d = document.createElement('div');
            d.className = 'test-case fail';
            d.textContent = 'GLOBAL ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col;
            document.body.appendChild(d);
        };
    </script>
    <!-- 共通モジュール -->
    <script src="js/common/lg_codes.js"></script>
    <script src="js/common/utils.js"></script>
    <script src="js/common/business-hours.js"></script>
    <script src="js/app/share.js"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .pass { color: #4caf50; font-weight: bold; }
        .fail { color: #f44336; font-weight: bold; }
        .test-case { margin: 6px 0; padding: 6px 12px; background: #1e1e1e; border-radius: 4px; }
        #summary { font-size: 1.2rem; margin-bottom: 20px; padding: 12px; border-radius: 6px; }
        iframe { width: 1280px; height: 1200px; border: 1px solid #444; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <h1>🍜 ジロリアンマップ 全機能自動テストスイート</h1>
    <div id="summary">テスト実行中...</div>
    <div id="results"></div>

    <!-- メイン画面とエディタの統合テスト用iframe -->
    <iframe id="app-frame" src="index.html"></iframe>
    <iframe id="editor-frame" src="editor.html"></iframe>

    <script>
        const results = [];
        const resultsContainer = document.getElementById('results');

        function assert(name, conditionFn, details = '') {
            let pass = false;
            let errDetail = '';
            try {
                pass = (typeof conditionFn === 'function') ? !!conditionFn() : !!conditionFn;
            } catch (e) {
                pass = false;
                errDetail = e.message;
            }
            const detText = (typeof details === 'function') ? details() : details;
            results.push({ name, pass, details: detText || errDetail });
            const div = document.createElement('div');
            div.className = 'test-case';
            div.innerHTML = `<span class="${pass ? 'pass' : 'fail'}">[${pass ? 'PASS' : 'FAIL'}]</span> ${name} ${(detText || errDetail) ? `<small style="color:#aaa;">(${detText || errDetail})</small>` : ''}`;
            resultsContainer.appendChild(div);
            return pass;
        }

        async function runTests() {
            console.log('Starting Test Suite...');

            // --- 1. JiroUtils 単体テスト ---
            assert('JiroUtils: 定義確認', () => typeof JiroUtils === 'object' && JiroUtils !== null);
            assert('JiroUtils.hiraganaToKatakana', () => JiroUtils.hiraganaToKatakana('じろりあん') === 'ジロリアン');
            assert('JiroUtils.toHalfWidth', () => JiroUtils.toHalfWidth('１２３　ＡＢＣ') === '123 ABC');
            assert('JiroUtils.parseNormalizedDateStr (Full)', () => JiroUtils.parseNormalizedDateStr('2026-08-02') === '2026-08-02');
            assert('JiroUtils.parseNormalizedDateStr (Year only)', () => JiroUtils.parseNormalizedDateStr('2026') === '2026-12-31');
            assert('JiroUtils.getLocalDateKey', () => /^\d{4}-\d{2}-\d{2}$/.test(JiroUtils.getLocalDateKey(new Date())));
            assert('JiroUtils.getJSTDateString', () => /^\d{4}-\d{2}-\d{2}$/.test(JiroUtils.getJSTDateString(new Date())));
            
            const dist = JiroUtils.calculateDistance(35.64805, 139.74160, 35.63421, 139.70711);
            assert('JiroUtils.calculateDistance', () => typeof dist === 'number' && dist > 3 && dist < 4, `三田本店-目黒店間: ${dist.toFixed(2)}km`);
            assert('JiroUtils.formatDistance (km)', () => JiroUtils.formatDistance(3.456) === '約 3.5km');
            assert('JiroUtils.formatDistance (1km未満)', () => JiroUtils.formatDistance(0.456) === '約 0.46km');
            assert('JiroUtils.cleanAddress', () => JiroUtils.cleanAddress(' 東京都港区三田２丁目１６－４ ') === '東京都港区三田2丁目16-4');
            assert('JiroUtils.normalizeFurigana', () => JiroUtils.normalizeFurigana('らーめんじろう') === 'ラーメンジロウ');
            assert('JiroUtils.normalizeAccountID', () => JiroUtils.normalizeAccountID('@ramenjiro') === 'ramenjiro');
            assert('JiroUtils.timeToFloat & floatToTime', () => JiroUtils.floatToTime(JiroUtils.timeToFloat('11:30')) === '11:30');

            // --- 2. JiroBusinessHours 単体テスト ---
            assert('JiroBusinessHours: 定義確認', () => typeof JiroBusinessHours === 'object' && JiroBusinessHours !== null);
            assert('JiroBusinessHours.isJapaneseHoliday (元日)', () => JiroBusinessHours.isJapaneseHoliday(new Date(2026, 0, 1)) === true);
            assert('JiroBusinessHours.isJapaneseHoliday (平日)', () => JiroBusinessHours.isJapaneseHoliday(new Date(2026, 0, 2)) === false);
            
            const parsedShifts = JiroBusinessHours.parseShiftString('11:00-14:30, 17:00-21:00');
            assert('JiroBusinessHours.parseShiftString', () => Array.isArray(parsedShifts) && parsedShifts.length === 2 && parsedShifts[0][0] === 11 && parsedShifts[0][1] === 14.5);
            assert('JiroBusinessHours.formatShiftArray', () => JiroBusinessHours.formatShiftArray(parsedShifts) === '11:00-14:30, 17:00-21:00');

            // モック店舗データによる営業判定テスト
            const mockShop = {
                id: 'test_shop',
                name: 'テスト二郎',
                openedAt: '2020-01-01',
                closedAt: null,
                shiftsByDay: {
                    '0': [[11, 14.5], [17, 21]], // 月曜
                    '6': [] // 日曜定休
                },
                temporary: [
                    { startDate: '2026-12-31', endDate: '2026-12-31', hours: [] } // 年末休業
                ]
            };
            const mockDateMonNoon = new Date(2026, 8, 21, 12, 0); // 2026-09-21 (月) 12:00
            const statusMonNoon = JiroBusinessHours.getBusinessStatus(mockShop, mockDateMonNoon);
            assert('JiroBusinessHours.getBusinessStatus (営業中判定)', () => statusMonNoon.type === 'open');

            const mockDateMonNight = new Date(2026, 8, 21, 23, 0); // 2026-09-21 (月) 23:00
            const statusMonNight = JiroBusinessHours.getBusinessStatus(mockShop, mockDateMonNight);
            assert('JiroBusinessHours.getBusinessStatus (営業時間外判定)', () => statusMonNight.type === 'closed');

            // --- 2-2. 開店前・閉店・未定・セル色判定テスト ---
            const preOpenShop = { id: 'pre_shop', name: '新店二郎', openedAt: '2026-12-01', closedAt: null, shiftsByDay: { '0': [[11, 15]] } };
            const beforeOpenDate = new Date(2026, 9, 4); // 2026-10-04 (開店前)
            assert('JiroBusinessHours.isPreOpen (開店日前日は休業扱い)', () => JiroBusinessHours.isPreOpen(preOpenShop, beforeOpenDate) === true);
            assert('JiroBusinessHours.getTodayShifts (オープン前店舗は空配列/休業)', () => {
                const s = JiroBusinessHours.getTodayShifts(preOpenShop, beforeOpenDate);
                return Array.isArray(s) && s.length === 0;
            });

            const closedShop = { id: 'closed_shop', name: '閉店二郎', openedAt: '2020-01-01', closedAt: '2026-09-30', shiftsByDay: { '0': [[11, 15]] } };
            const afterCloseDate = new Date(2026, 9, 1); // 2026-10-01 (閉店翌日)
            assert('JiroBusinessHours.isClosedShopExpired (閉店日翌日以降は閉店)', () => JiroBusinessHours.isClosedShopExpired(closedShop, afterCloseDate) === true);
            assert('JiroBusinessHours.getTodayShifts (閉店店舗は翌日以降空配列/休業)', () => {
                const s = JiroBusinessHours.getTodayShifts(closedShop, afterCloseDate);
                return Array.isArray(s) && s.length === 0;
            });

            const noOpenDateShop = { id: 'pending_open_shop', name: '準備中二郎', openedAt: '', closedAt: null, shiftsByDay: { '0': [[11, 15]] } };
            assert('JiroBusinessHours.getTodayShifts (開店日未定はすべて「休業」)', () => {
                const s = JiroBusinessHours.getTodayShifts(noOpenDateShop, beforeOpenDate);
                return Array.isArray(s) && s.length === 0;
            });
            assert('JiroBusinessHours.getBusinessStatus (開店日未定は「オープン予定」)', () => {
                const st = JiroBusinessHours.getBusinessStatus(noOpenDateShop, beforeOpenDate);
                return st.type === 'preopen' && st.label === 'オープン予定';
            });
            assert('JiroBusinessHours.getNextOpenScheduleText (開店日未定は次回営業時間「未定」)', () => {
                const text = JiroBusinessHours.getNextOpenScheduleText(noOpenDateShop, beforeOpenDate);
                return text.includes('未定');
            });
            assert('JiroBusinessHours.getBusinessStatus (オープン前店舗は「オープン予定」)', () => {
                const st = JiroBusinessHours.getBusinessStatus(preOpenShop, beforeOpenDate);
                return st.type === 'preopen' && st.label === 'オープン予定';
            });
            assert('JiroBusinessHours.formatShiftList (オープン前店舗の未設定シフトは「未定」)', () => JiroBusinessHours.formatShiftList([], true) === '未定');
            assert('JiroUtils.formatOpenedDateText (開店日空欄は「開店日未定」)', () => JiroUtils.formatOpenedDateText('') === '開店日未定');

            // 制覇店舗カウント対象判定テスト
            const normalShop = mockShop;
            const openDate = new Date(2026, 11, 1); // 2026-12-01 (preOpenShop の開店当日)
            assert('JiroBusinessHours.isConquestTarget (通常営業中店舗はカウント対象)', () => JiroBusinessHours.isConquestTarget(normalShop, beforeOpenDate) === true);
            assert('JiroBusinessHours.isConquestTarget (オープン前店舗はカウント除外)', () => JiroBusinessHours.isConquestTarget(preOpenShop, beforeOpenDate) === false);
            assert('JiroBusinessHours.isConquestTarget (オープン日当日はカウント対象)', () => JiroBusinessHours.isConquestTarget(preOpenShop, openDate) === true);
            assert('JiroBusinessHours.isConquestTarget (開店日未定店舗はカウント除外)', () => JiroBusinessHours.isConquestTarget(noOpenDateShop, beforeOpenDate) === false);
            assert('JiroBusinessHours.isConquestTarget (閉店済み店舗はカウント除外)', () => JiroBusinessHours.isConquestTarget(closedShop, afterCloseDate) === false);

            const pendingShiftsShop = { id: 'pending_shifts_shop', name: '未定二郎', openedAt: '2020-01-01', closedAt: null, shiftsByDay: { '0': '未定' } };
            assert('JiroBusinessHours.getTodayShifts (営業時間シフト「未定」は「未定」)', () => JiroBusinessHours.getTodayShifts(pendingShiftsShop, new Date(2026, 8, 21)) === '未定');
            assert('JiroBusinessHours.parseShiftString (「未定」のパース)', () => JiroBusinessHours.parseShiftString('未定') === '未定');
            assert('JiroBusinessHours.formatShiftArray (「未定」のフォーマット)', () => JiroBusinessHours.formatShiftArray('未定') === '未定');

            // --- 3. LG_CODES 単体テスト ---
            assert('LG_CODES: 定義確認', () => typeof LG_CODES === 'object' && LG_CODES !== null, () => 'LG_CODES type: ' + (typeof LG_CODES));
            assert('LG_CODES.cities: 全47都道府県の市区町村（1800件以上内蔵）', () => Object.keys(LG_CODES.cities).length >= 1800, `自治体数: ${Object.keys(LG_CODES.cities).length}`);
            assert('LG_CODES.getPrefNameByCityCode', () => LG_CODES.getPrefNameByCityCode('13103') === '東京都');
            assert('LG_CODES.getCityName', () => LG_CODES.getCityName('13103') === '港区');
            assert('LG_CODES.getShopFullAddress', () => LG_CODES.getShopFullAddress({ cityCode: '13103', addressText: '三田2-16-4' }) === '東京都港区三田2-16-4');
            
            const parsedAddr1 = LG_CODES.parseAddress('東京都港区三田2-16-4');
            assert('LG_CODES.parseAddress (都道府県・市区町村分離)', () => parsedAddr1.prefCode === '13' && parsedAddr1.cityCode === '13103' && parsedAddr1.remainingAddress === '三田2-16-4');
            const parsedAddr2 = LG_CODES.parseAddress('港区三田2-16-4');
            assert('LG_CODES.parseAddress (市区町村のみから都道府県逆引き分離)', () => parsedAddr2.prefCode === '13' && parsedAddr2.cityCode === '13103' && parsedAddr2.remainingAddress === '三田2-16-4');
            assert('LG_CODES.getPrefAndCityName (shop object)', () => LG_CODES.getPrefAndCityName({ prefCode: '13', cityCode: '13103' }) === '東京都港区');
            assert('LG_CODES.getPrefAndCityName (shop object with prefCode only)', () => LG_CODES.getPrefAndCityName({ prefCode: '13' }) === '東京都');
            assert('LG_CODES.getPrefAndCityName (prefCode and cityCode args)', () => LG_CODES.getPrefAndCityName('13', '13103') === '東京都港区');
            assert('LG_CODES.getPrefAndCityName (cityCode alone)', () => LG_CODES.getPrefAndCityName('13103') === '東京都港区');

            // --- 4. share.js 単体テスト ---
            assert('share.js: window.shareFullGridImage 定義確認', () => typeof window.shareFullGridImage === 'function');
            assert('share.js: window.captureElementWithPadding 定義確認', () => typeof window.captureElementWithPadding === 'function');
            assert('share.js: window.openShareOptionsModal 定義確認', () => typeof window.openShareOptionsModal === 'function');

            // --- 5. メイン画面 (index.html) 統合テスト (iframe内評価) ---
            const appFrame = document.getElementById('app-frame');
            await new Promise((resolve) => {
                let attempts = 0;
                const checkApp = setInterval(() => {
                    attempts++;
                    try {
                        const appWin = appFrame.contentWindow;
                        if (appWin && appWin.isAppInitialized && appWin.document.querySelectorAll('#shop-grid .shop-item').length > 0) {
                            clearInterval(checkApp);
                            resolve();
                        }
                    } catch (e) {}
                    if (attempts > 80) { // 8秒タイムアウト
                        clearInterval(checkApp);
                        resolve();
                    }
                }, 100);
            });

            try {
                const appWin = appFrame.contentWindow;
                const appDoc = appWin.document;

                assert('メインアプリ: 初期化フラグ (isAppInitialized)', () => appWin.isAppInitialized === true);
                
                const shopCards = appDoc.querySelectorAll('#shop-grid .shop-item');
                assert('メインアプリ: 店舗カード描画件数 (40店舗以上)', () => shopCards.length >= 40, `実数: ${shopCards.length}店舗`);

                const sortSelect = appDoc.getElementById('sort-select');
                assert('メインアプリ: ソートドロップダウン存在', () => sortSelect !== null);

                // 検索機能テスト
                const searchInput = appDoc.getElementById('search-input');
                searchInput.value = '三田';
                if (typeof appWin.onSearchInput === 'function') {
                    appWin.onSearchInput();
                } else {
                    searchInput.dispatchEvent(new Event('input'));
                }
                const filteredCards = appDoc.querySelectorAll('#shop-grid .shop-item');
                assert('メインアプリ: 検索フィルタリング動作（「三田」で絞り込み）', filteredCards.length >= 1 && filteredCards.length < 5, `該当数: ${filteredCards.length}店舗`);
                
                // 検索リセット
                searchInput.value = '';
                appWin.onSearchInput();

                // 制覇トラッカーのクリックトグル動作テスト
                const firstCard = appDoc.querySelector('#shop-grid .shop-item');
                const firstShopId = firstCard ? firstCard.dataset.shopId : null;
                if (firstShopId && typeof appWin.toggleVisit === 'function') {
                    const beforeVisit = !!appWin.visitedState[firstShopId];
                    appWin.toggleVisit(firstShopId, false, new MouseEvent('click'));
                    const afterVisit = !!appWin.visitedState[firstShopId];
                    assert('メインアプリ: 制覇トグル (toggleVisit)', beforeVisit !== afterVisit);
                    // 元に戻す
                    appWin.toggleVisit(firstShopId, false, new MouseEvent('click'));
                }

                // オープン予定フィルタUIテスト
                const preOpenChip = appDoc.getElementById('filter-chip-preopen');
                assert('オープン予定フィルタ: 要素が存在する', () => preOpenChip !== null);
                const hasPreOpen = (appWin.shops || []).some(s => appWin.getBusinessStatus(s).type === 'preopen');
                assert('オープン予定フィルタ: 該当店舗の有無に応じた表示/非表示同期', () => {
                    const isVisible = preOpenChip.style.display !== 'none';
                    return isVisible === hasPreOpen;
                });

                // 共有画像設定モーダルの表示条件テスト
                const gridEl = appDoc.getElementById('shop-grid');
                const conquestSec = appDoc.getElementById('share-opt-conquest-section');
                const statusSec = appDoc.getElementById('share-opt-status-section');
                const metaSec = appDoc.getElementById('share-opt-meta-section');

                // 1. 店舗情報-コンパクト (minimal)
                appWin.openShareOptionsModal(gridEl, null, 'minimal', 'test', 'test');
                assert('共有設定: コンパクト表示 (制覇:表示, 営業状況:表示, メタ:非表示)', () => {
                    return conquestSec.style.display === 'block' && statusSec.style.display === 'block' && metaSec.style.display === 'none';
                });
                appWin.closeShareOptionsModal();

                // 2. 営業情報-日別 (today)
                appWin.openShareOptionsModal(gridEl, null, 'today', 'test', 'test');
                assert('共有設定: 日別表示 (制覇:表示, 営業状況:非表示, メタ:表示)', () => {
                    return conquestSec.style.display === 'block' && statusSec.style.display === 'none' && metaSec.style.display === 'block';
                });
                appWin.closeShareOptionsModal();

                // 3. 店舗詳細ポップアップ (popup_detail)
                const firstShopObj = (appWin.shops || [])[0];
                appWin.openShareOptionsModal(gridEl, firstShopObj, 'popup_detail', 'test', 'test');
                assert('共有設定: 店舗詳細 (制覇:表示, 営業状況:表示, メタ:表示)', () => {
                    return conquestSec.style.display === 'block' && statusSec.style.display === 'block' && metaSec.style.display === 'block';
                });
                appWin.closeShareOptionsModal();

                // 4. カレンダー (calendar)
                appWin.openShareOptionsModal(gridEl, firstShopObj, 'calendar', 'test', 'test');
                assert('共有設定: カレンダー (制覇:非表示, 営業状況:非表示, メタ:表示)', () => {
                    return conquestSec.style.display === 'none' && statusSec.style.display === 'none' && metaSec.style.display === 'block';
                });
                appWin.closeShareOptionsModal();

                // 5. 実際のUI切り替えテスト: 「店舗情報-コンパクト」時の shareFullGridImage()
                appWin.setListSubMode('minimal');
                appWin.shareFullGridImage();
                assert('共有設定 (UI連携): コンパクト表示シェア起動 (制覇:表示, 営業状況:表示)', () => {
                    return conquestSec.style.display === 'block' && statusSec.style.display === 'block';
                });
                appWin.closeShareOptionsModal();

                // 画像生成実行テスト (executeImageShare)
                let caughtErrors = [];
                let shareLogs = [];
                const origConsoleLog = appWin.console.log;
                appWin.console.log = function(...args) {
                    const str = args.join(' ');
                    if (str.includes('[DEBUG-SHARE]')) {
                        shareLogs.push(str);
                    }
                    origConsoleLog.apply(this, args);
                };
                const origConsoleErr = appWin.console.error;
                appWin.console.error = function(...args) {
                    const msg = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
                    caughtErrors.push(msg);
                    origConsoleErr.apply(this, args);
                };
                appWin.alert = (msg) => {
                    caughtErrors.push('ALERT: ' + msg);
                };

                let matrixCanvasCount = 0;
                const origCapture = appWin.captureElementWithPadding;
                appWin.captureElementWithPadding = async function(target, pad) {
                    matrixCanvasCount++;
                    const c = document.createElement('canvas');
                    c.width = 800; c.height = 600;
                    return c;
                };

                try {
                    await Promise.race([
                        appWin.executeImageShare(true),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT_5s')), 5000))
                    ]);
                } catch (e) {
                    caughtErrors.push('THROWN: ' + (e.stack || e.message));
                } finally {
                    appWin.captureElementWithPadding = origCapture;
                    appWin.console.error = origConsoleErr;
                    appWin.console.log = origConsoleLog;
                    appWin.closeShareOptionsModal();
                }

                const detailMsg = (caughtErrors.length > 0 ? caughtErrors.join(' | ') : '') + ' [LOGS: ' + shareLogs.join(' -> ') + `] (枚数: ${matrixCanvasCount})`;
                assert('営業情報-一覧: 画像生成実行 (executeImageShare)', () => caughtErrors.length === 0 && matrixCanvasCount > 0, detailMsg);

                await new Promise(r => setTimeout(r, 100));

                // 9. X自動投稿相当テスト: 「営業情報-日別」時の shareFullGridImage() & ヘッダー包含確認
                appWin.setListSubMode('today');
                await new Promise(r => setTimeout(r, 100));

                appWin.shareFullGridImage();
                await new Promise(r => setTimeout(r, 50));

                const todaySplitCb = appDoc.getElementById('share-opt-split');
                if (todaySplitCb) todaySplitCb.checked = false;

                let todayCaughtErrors = [];
                let capturedHeaderTitles = [];
                let todayCanvasCount = 0;
                const origCapture2 = appWin.captureElementWithPadding;
                appWin.captureElementWithPadding = async function(target, pad) {
                    const headerLegend = target ? (target.querySelector('.capture-header-legend') || target.querySelector('.capture-header-title')) : null;
                    if (headerLegend) {
                        capturedHeaderTitles.push(headerLegend.textContent);
                    }
                    todayCanvasCount++;
                    const c = document.createElement('canvas');
                    c.width = 800; c.height = 600;
                    return c;
                };
                const origErr2 = appWin.console.error;
                appWin.console.error = function(...args) {
                    const msg = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
                    todayCaughtErrors.push(msg);
                    origErr2.apply(this, args);
                };

                try {
                    await Promise.race([
                        appWin.executeImageShare(true),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT_5s')), 5000))
                    ]);
                } catch (e) {
                    todayCaughtErrors.push('THROWN: ' + (e.stack || e.message));
                } finally {
                    appWin.captureElementWithPadding = origCapture2;
                    appWin.console.error = origErr2;
                    appWin.closeShareOptionsModal();
                }

                const todayDetail = (todayCaughtErrors.length > 0 ? todayCaughtErrors.join(' | ') : '') + ` [ヘッダー: ${capturedHeaderTitles.join(', ')}] (枚数: ${todayCanvasCount})`;
                assert('営業情報-日別 (X自動投稿): 画像生成実行 & ヘッダー包含確認', () => todayCaughtErrors.length === 0 && todayCanvasCount > 0 && capturedHeaderTitles.length > 0, todayDetail);

                await new Promise(r => setTimeout(r, 100));

                // 店舗詳細シェアのために通常モード（詳細表示）に復帰
                if (typeof appWin.setListSubMode === 'function') {
                    appWin.setListSubMode('all');
                }
                if (typeof appWin.setMainViewMode === 'function') {

                edWin.app.renderPendingList();

                const allCardsInContainer = edDoc.querySelectorAll('#pending-list-container .pending-card');
                assert('同一グループ統合: 未処理と反映不要が同一コンテナ内に描画 (計2件)', () => allCardsInContainer.length === 2);
                assert('要反映優先ソート: 要反映カード (三田本店) が1件目に配置', () => allCardsInContainer[0] && allCardsInContainer[0].id === 'pending-card-pending_active_1');
                assert('要反映優先ソート: 反映不要カード (亀戸店) が2件目に配置', () => allCardsInContainer[1] && allCardsInContainer[1].id === 'pending-card-skipped_item_1');
                assert('カード表示: 反映不要カードに理由が表示されている', () => allCardsInContainer[1].textContent.includes('登録済') || allCardsInContainer[1].textContent.includes('通常営業') || allCardsInContainer[1].textContent.includes('一致'));
                assert('一括スキップボタン: ツールバーに一括スキップボタンが存在', () => edDoc.getElementById('btn-bulk-skip-all') !== null);

                // AI判定ルールモーダル操作
                edWin.app.openAiGuidelinesModal();
                assert('AIルール管理: モーダルが開く (activeクラス付与)', () => edDoc.getElementById('ai-rules-modal').classList.contains('active'));
                
                const kwInputElem = edDoc.getElementById('ai-keywords-input');
                assert('AIルール管理: キーワード設定入力欄が存在し初期値が展開されている', () => kwInputElem && kwInputElem.value.includes('休') && kwInputElem.value.includes('営業'));

                // キーワード編集と同期
                kwInputElem.value += ', テスト新単語';
                edWin.app.syncAiRulesFromUI();
                assert('AIルール管理: キーワードUI編集が aiGuidelines に同期される', () => (edWin.app.aiGuidelines.scheduleKeywords.keywords || []).includes('テスト新単語'));

                const ruleRowsBefore = edDoc.querySelectorAll('#ai-rules-list .ai-rule-title').length;
                edWin.app.addNewAiRule();
                const ruleRowsAfter = edDoc.querySelectorAll('#ai-rules-list .ai-rule-title').length;
                assert('AIルール管理: 新規ルール行の追加', () => ruleRowsAfter === ruleRowsBefore + 1);

                edWin.app.closeAiGuidelinesModal();
                assert('AIルール管理: モーダルが閉じる', () => !edDoc.getElementById('ai-rules-modal').classList.contains('active'));

            } catch (err) {
                assert('エディタ: 統合テスト例外', false, err.message);
            }

            // --- サマリー出力 ---
            const total = results.length;
            const passCount = results.filter(r => r.pass).length;
            const failCount = total - passCount;
            const summaryDiv = document.getElementById('summary');
            if (failCount === 0) {
                summaryDiv.className = 'pass';
                summaryDiv.style.background = '#1b5e20';
                summaryDiv.innerHTML = `🎉 全テスト合格！ (${passCount} / ${total} PASS)`;
            } else {
                summaryDiv.className = 'fail';
                summaryDiv.style.background = '#b71c1c';
                summaryDiv.innerHTML = `⚠️ 一部テスト失敗 (${failCount} 件失敗 / 計 ${total} 件)`;
            }

            window.__TEST_RESULTS__ = { total, passCount, failCount, results };
            console.log('Test Suite Finished:', JSON.stringify(window.__TEST_RESULTS__));
        }

        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
